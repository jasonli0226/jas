name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly, so platform breakage surfaces on a quiet main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test on Linux only; main, the weekly run and manual
        # runs add macOS and Windows.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    # Hosted macOS runners are often short of capacity; don't let a runner
    # that never arrives fail main.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Vet
        run: go vet ./...

      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            go test ./... -count=1
          else
            go test ./... -race -count=1
          fi

      - name: Merge hook matcher
        if: runner.os == 'Linux'
        run: bash .agents/skills/pr-review-loop/scripts/check-pr-reviewed_test.sh
